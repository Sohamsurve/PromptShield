- id: PI-CRED-001
  attack_types: [credential_theft]
  severity: 0.85
  reason_code: CRED_PASSWORD
  langs: [en]
  context: any
  patterns:
    - regex: (?i)\bre-?enter\s+your\s+password\s+to\s+continue\b
- id: PI-CRED-002
  attack_types: [credential_theft]
  severity: 0.85
  reason_code: CRED_SESSION
  langs: [en]
  context: any
  patterns:
    - regex: (?i)\bsession\s+expired\b.{0,40}\benter\s+password\b
- id: PI-CRED-003
  attack_types: [credential_theft]
  severity: 0.85
  reason_code: CRED_ENV
  langs: [en]
  context: any
  patterns:
    - regex: (?i)\bprint\s+all\s+environment\s+variables\s+to\s+the\s+chat\b
- id: PI-CRED-004
  attack_types: [credential_theft]
  severity: 0.85
  reason_code: CRED_SSH
  langs: [en]
  context: any
  patterns:
    - regex: (?i)\bcat\s+~?/?\.ssh/id_rsa\b.{0,30}\bpaste\b
- id: PI-CRED-005
  attack_types: [credential_theft]
  severity: 0.85
  reason_code: CRED_DOTENV
  langs: [en]
  context: any
  patterns:
    - regex: (?i)\bopen\s+\.env\s+and\s+print\s+the\s+secrets\b
