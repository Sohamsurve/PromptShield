  patterns:
    - regex: (?i)\bpaste\s+your\s+api[_ ]?key\s+into\b
- id: PI-CRED-007
  attack_types: [credential_theft]
  severity: 0.8
  reason_code: CRED_COOKIE
  langs: [en]
  context: any
  patterns:
    - regex: (?i)\bsteal\s+session\s+cookies\b
- id: PI-CRED-008
  attack_types: [credential_theft]
  severity: 0.8
